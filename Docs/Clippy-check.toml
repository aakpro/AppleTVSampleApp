[check]  
requires_all_fields = false  
require_type_safety = true  
allow_any_in_domain = false  
strict_type_checks = true  

# Domain Layer - ZERO External Dependencies Rule  
[domain_layer]
forbidden_import_categories = ["Network", "API", "Presentation", "UI"]

# API Layer - Protocol-Based Injection Rule  
[api_layer]  
protocol_types_required = true  # All dependencies must be protocol types

# Entity Types - Must be Value Types  
[entities]
value_types_only = true  
