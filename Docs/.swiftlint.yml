rules:
  - name: strict
    description: "Enforce strict type safety across all files"  
    severity: error
  
  - name: cyclomatic_complexity
    warning_limit: 15
    error_limit: 20
    
  - name: nesting
    warning_limit: 4
    error_limit: 5
  
  - name: line_length
    warning_limit: 79
    error_limit: 100  
    configuration:
      indent_size: 2
      indent_type: spaces
      
  - name: force_unwrapping
    severity: error  # Force unwrap (any?.!) = CRITICAL
  
  - name: any_object_as_any
    severity: error

custom_rules:
  - name: pure_domain_checker
    description: "Domain layer must have zero external dependencies" 
    severity: error
    condition: "file_path_matches_pattern('sampletv-domain-swift-package/Sources')"

excluded_files:
  - "**/Tests/**/*Test*"
  - "**/Info.plist"
